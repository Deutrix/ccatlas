name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 3-platform matrix is a hard requirement from Phase 1 onward
  # (docs/tasks.md "Global Constraints"). No POSIX path assumptions anywhere.
  build:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Both ends of the engines range in package.json ("^22.13.0 || >=24.0.0").
        # 22.13 is the first release where node:sqlite is available unflagged,
        # which T4.2 depends on.
        node: ['22.13', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Requires package-lock.json to be committed.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Invoked via `node` rather than by name: Windows does not honour shebangs.
      - name: Smoke test the emitted binary
        run: |
          node bin/ccatlas --version
          node bin/ccatlas --json

      - name: Leak scan
        run: npm run leak-scan

      - name: Test
        run: npm test

      # Proves the engines floor rather than trusting release notes: node:sqlite
      # must import without --experimental-sqlite on every matrix leg, because
      # T4.2 depends on it. Nothing in src/ imports it yet — this is a check on
      # the declared floor, not a feature.
      - name: Verify node:sqlite is available unflagged
        run: node --input-type=module -e "await import('node:sqlite'); console.log('node:sqlite OK unflagged')"

  # Both gates below are required by docs/tasks.md "Global Constraints" and
  # docs/02-architecture.md §11. **Both are now blocking.**
  #
  # They measure the STAGED package (dist/plugin) rather than the repo root.
  # The two are the same directory during development, which is convenient and
  # misleading: `validate . --strict` fails at the root on this repository's
  # own CLAUDE.md — correctly, since a CLAUDE.md at a plugin root is not loaded
  # as project context — but that file never ships. Validating the staged copy
  # tests what users actually install, and catches the opposite mistake too: a
  # component that only works because of a file the package does not include.
  plugin-gates:
    name: Claude Code plugin gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The `claude` CLI is not preinstalled on GitHub runners.
      - name: Install Claude Code CLI
        id: install-claude
        continue-on-error: true
        run: npm i -g @anthropic-ai/claude-code

      - name: Check the CLI is available
        id: probe
        run: |
          if command -v claude >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            claude --version
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "SKIPPED: claude CLI not on runner — plugin gates did not execute."
          fi

      # Stage the shippable plugin. Everything below measures THIS, not the
      # working tree — see the note above the job.
      - name: Stage the plugin package
        if: steps.probe.outputs.available == 'true'
        run: npm run package

      # Gate 1 — manifest, frontmatter and hook validation. BLOCKING.
      - name: claude plugin validate --strict
        if: steps.probe.outputs.available == 'true'
        run: claude plugin validate dist/plugin --strict

      # Gate 2 — 📏 context budget. 600 always-on tokens is a hard acceptance
      # number (docs/tasks.md, T7.6), not a guideline, and it is the number the
      # whole product argues for: a tool that tells people what their stack
      # costs them, costing 2,000 tokens itself, would be the thing it warns
      # about.
      #
      # T0.2's verdict landed — `plugin details` is text-only, and its grammar
      # plus four traps are documented in docs/FORMATS.md §1. scripts/
      # token-budget.mjs parses it with the same code the product uses and
      # exits 1 above the ceiling. BLOCKING.
      - name: 📏 Always-on token budget (≤600)
        if: steps.probe.outputs.available == 'true'
        run: npm run token-budget
